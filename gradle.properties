# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# The *Kotlin* daemon's heap, not Gradle's. `:app`'s wasm test executable is the largest
# single link in this build — the whole Compose web runtime plus the app, its five common
# tests and the `:scripting` interface in one module — and at the default heap it dies with
# `OutOfMemoryError: GC overhead limit exceeded` inside the IR incremental cache, which is
# several phases *before* the linker starts. So the error names a cache rather than the thing
# that actually needs the memory.
# `-Xmx` is a ceiling, not a reservation: a machine without 4 GB free simply never reaches it,
# so this costs nothing on a smaller box and needs no per-machine override.
kotlin.daemon.jvmargs=-Xmx4g
# Prefer the locally installed JDK 21 for the toolchain declared in the convention plugin.
# Gradle still falls back to the foojay resolver on machines without this path, so the
# build stays portable. Needed here because ~/.gradle/jdks holds only a half-downloaded
# JDK 21 (a stale foojay lock) which would otherwise be picked as JAVA_HOME.
org.gradle.java.installations.paths=/home/bob/.jdks/jbrsdk_jcef-21.0.7
